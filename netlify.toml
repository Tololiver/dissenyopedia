[build]
  command   = "npm install"
  publish   = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION            = "18"
  SECRETS_SCAN_OMIT_KEYS  = "SUPABASE_URL"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
